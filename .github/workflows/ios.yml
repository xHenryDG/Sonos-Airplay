name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install ldid (Pseudo-Signing)
        run: brew install ldid

      # Zeigt im Log wo die Dateien liegen
      - name: Debug - List Files
        run: |
          find . -maxdepth 3 -name "*.xcodeproj"
          xcodebuild -version

      - name: Build Archive
        run: |
          # Tiefer suchen – kein maxdepth-Limit
          PROJECT_PATH=$(find . -name "*.xcodeproj" -not -path "*/.git/*" | head -n 1)
          SCHEME_NAME=$(basename "$PROJECT_PATH" .xcodeproj)

          echo "Projekt: $PROJECT_PATH"
          echo "Scheme:  $SCHEME_NAME"

          # Abbruch wenn nichts gefunden
          test -n "$PROJECT_PATH" || (echo "ERROR: Kein .xcodeproj gefunden!" && exit 1)

          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath build/Output.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            INSTALL_PATH=/Applications

      # Zeigt was wirklich im Archive gelandet ist
      - name: Debug - Archive Contents
        run: find build/Output.xcarchive -name "*.app" | head -10

      - name: Pseudo-Sign & Package IPA
        run: |
          APP=$(find build/Output.xcarchive -name "*.app" -not -name "*.appex" | head -n 1)
          echo "Gefunden: $APP"
          test -d "$APP" || (echo "ERROR: Kein .app im Archive – Build fehlgeschlagen!" && exit 1)

          # Pseudo-Signatur mit ldid (nötig für AltStore / Sideloadly)
          ldid -S "$APP"

          mkdir -p build/output/Payload
          cp -R "$APP" build/output/Payload/
          cd build/output && zip -r Sonos-Airplay_unsigned.ipa Payload/
          ls -lh Sonos-Airplay_unsigned.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonos-Airplay-IPA
          path: build/output/Sonos-Airplay_unsigned.ipa
          retention-days: 30
