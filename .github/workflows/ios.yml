name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # Dieser Schritt zeigt dir im Log genau an, wo deine Dateien liegen
      - name: Debug - List Files
        run: find . -maxdepth 2 -name "*.xcodeproj"

      - name: Build Archive
        run: |
          # SUCHE DIE DATEI AUTOMATISCH (falls sie in einem Unterordner liegt)
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          # EXTRAHIERE DEN NAMEN OHNE .xcodeproj
          SCHEME_NAME=$(basename "$PROJECT_PATH" .xcodeproj)
          
          echo "Baue Projekt: $PROJECT_PATH mit Scheme: $SCHEME_NAME"

          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -archivePath build/Output.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export IPA (Unsigned)
        run: |
          mkdir -p build/output/Payload
          cp -R build/Output.xcarchive/Products/Applications/*.app build/output/Payload/
          cd build/output && zip -r Sonos-Airplay_unsigned.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonos-Airplay-IPA
          path: build/output/Sonos-Airplay_unsigned.ipa
