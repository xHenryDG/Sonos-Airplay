name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install ldid
        run: brew install ldid

      # Zeigt die ECHTE Ordnerstruktur im Log – zum Nachschauen
      - name: Debug - Show full tree
        run: find . -not -path "*/.git/*" | sort

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project SAB3/SonosAirBridge.xcodeproj \
            -scheme SonosAirBridge \
            -configuration Release \
            -archivePath build/Output.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            INSTALL_PATH=/Applications

      - name: Package IPA
        run: |
          APP=$(find build/Output.xcarchive -name "*.app" -not -name "*.appex" | head -n 1)
          echo "App gefunden: $APP"
          test -d "$APP" || (echo "ERROR: Kein .app gefunden!" && exit 1)
          ldid -S "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r SonosAirBridge.ipa Payload/
          ls -lh SonosAirBridge.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SonosAirBridge-IPA
          path: SonosAirBridge.ipa
          retention-days: 30
