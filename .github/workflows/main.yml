name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install ldid
        run: brew install ldid

      # Zeigt die ECHTE Struktur – damit wir den Pfad sehen
      - name: Debug - Show full tree
        run: |
          echo "=== Arbeitsverzeichnis ==="
          pwd
          echo "=== Alle Dateien ==="
          find . -not -path "*/.git/*" | sort
          echo "=== Xcode Version ==="
          xcodebuild -version

      - name: Build Archive
        run: |
          # Automatisch suchen – funktioniert egal ob SAB3/ Unterordner oder nicht
          PROJECT=$(find . -not -path "*/.git/*" -name "*.xcodeproj" -type d | head -n 1)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          echo "Projekt: $PROJECT"
          echo "Scheme:  $SCHEME"
          test -n "$PROJECT" || (echo "ERROR: Kein .xcodeproj gefunden!" && exit 1)

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Output.xcarchive" \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            INSTALL_PATH=/Applications \
            2>&1

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/Output.xcarchive" -name "*.app" -not -name "*.appex" | head -n 1)
          echo "App: $APP"
          test -d "$APP" || (echo "ERROR: Kein .app gefunden!" && exit 1)
          ldid -S "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r SonosAirBridge.ipa Payload/
          ls -lh SonosAirBridge.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SonosAirBridge-IPA
          path: SonosAirBridge.ipa
          retention-days: 30
